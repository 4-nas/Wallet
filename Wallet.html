<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet</title>
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#F3EEE3">
<script>try{var q=JSON.parse(localStorage.getItem("wallet-v1")||"{}"),t=q.theme;if(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EEE3; --ink:#111111; --orange:#D9541E;
  --glass:rgba(255,255,255,.38); --glass-edge:rgba(255,255,255,.65);
  --ink-glass:rgba(17,17,17,.82);
  --font:"Product Sans","Google Sans","Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
body{height:100%;background:var(--cream);color:var(--ink);font-family:var(--font);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:12px}

/* background animation */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.b1{width:460px;height:460px;background:radial-gradient(circle,var(--orange) 0,transparent 68%);top:-90px;left:-80px;animation:drift1 16s ease-in-out infinite alternate;opacity:.4}
.b2{width:420px;height:420px;background:radial-gradient(circle,var(--ink) 0,transparent 68%);bottom:-110px;right:-90px;animation:drift2 19s ease-in-out infinite alternate;opacity:.16}
.b3{width:320px;height:320px;background:radial-gradient(circle,var(--orange) 0,transparent 68%);top:45%;right:-60px;animation:drift3 22s ease-in-out infinite alternate;opacity:.22}
@keyframes drift1{to{transform:translate(120px,160px) scale(1.2)}}
@keyframes drift2{to{transform:translate(-140px,-120px) scale(1.15)}}
@keyframes drift3{to{transform:translate(-90px,-180px) scale(.85)}}

/* mobile-first column on every screen */
.app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100%;margin:0 auto;padding:20px 18px 120px}
@media(min-width:560px){
  .app{min-height:calc(100% - 32px);margin-top:16px;border-radius:36px;background:rgba(243,238,227,.45);
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-edge);
    box-shadow:0 30px 80px rgba(17,17,17,.18)}
}

/* loader */
#loader{position:fixed;inset:0;z-index:50;background:var(--ink);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#loader.done{opacity:0;visibility:hidden}
.ring{width:72px;height:72px;border-radius:50%;border:3px solid rgba(243,238,227,.15);border-top-color:var(--orange);animation:spin 1s linear infinite;display:grid;place-items:center}
.ring span{font-weight:700;font-size:26px;color:var(--cream);animation:spin 1s linear infinite reverse}
.lname{margin-top:18px;color:var(--cream);font-weight:500;letter-spacing:.04em;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:26px;font-weight:600;line-height:1.15}
.top p{font-size:14px;opacity:.65}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--orange);color:var(--cream);font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 4px var(--glass-edge);transition:transform .3s var(--ease)}
.avatar:active{transform:scale(.9) rotate(-8deg)}

/* glass primitives */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:26px;
  
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 30px rgba(17,17,17,.08)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(243,238,227,.92)}}

/* balance card */
.card{position:relative;overflow:hidden;padding:24px;border-radius:30px;color:var(--cream);
  background:linear-gradient(145deg,rgba(17,17,17,.92),rgba(17,17,17,.74));
  border:1px solid rgba(255,255,255,.18);

  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px rgba(17,17,17,.3);
  transition:transform .5s var(--ease)}
.card::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,var(--orange),transparent 70%);opacity:.85;transform:scale(1.12) translate(-5px,5px)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);
  display:none}
.card>*{position:relative;z-index:1}
/* card slider: credit-card ratio 85.6 x 54 */
.deck{width:min(100vw,480px);margin:-16px calc(50% - min(50vw,240px)) -44px;padding:22px 0 56px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.deck.drag{cursor:grabbing}
@media(min-width:560px){.deck{width:auto;margin:-16px -18px -44px}}
.track{display:flex;align-items:flex-start;gap:14px;padding:0 12px;will-change:transform}
.cc{flex:0 0 calc(100% - 10px);aspect-ratio:1.586;padding:0;transition:none;text-align:left;display:block;font:inherit;will-change:transform,opacity}
.cc{--u:3.2px;--neon:var(--orange);color:var(--cream);border-radius:30px}
@supports (width:1cqw){.deck{container-type:inline-size}.cc{container-type:inline-size;--u:1cqw;border-radius:calc((100cqw - 34px)*.092056)}}
.cc::before{right:-80px;top:auto;bottom:-100px;opacity:.28}
.cc{contain:paint}
.cc.c3{background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.26),transparent 55%),linear-gradient(145deg,rgba(168,62,20,.66),rgba(24,14,10,.86) 58%,rgba(17,17,17,.92))}
.cc.c1,.cc.c2{border:0;--neon:#F2672B;--core:#FFD2B8;--glow:rgba(242,103,43,.38);--tint:rgba(168,62,20,.66);background:radial-gradient(120% 70% at 12% 0%,rgba(255,255,255,.26),transparent 55%),linear-gradient(145deg,var(--tint),rgba(24,14,10,.86) 58%,rgba(17,17,17,.92));box-shadow:0 0 16px var(--glow),0 10px 20px rgba(17,17,17,.28)}
.cc.c1::before,.cc.c2::before{background:radial-gradient(circle,var(--neon),transparent 70%);opacity:.2}
.neon{position:absolute;inset:0;width:100%;height:100%;color:var(--neon);pointer-events:none}
.stat{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*4);display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:calc(var(--u)*1.4) calc(var(--u)*2.6);border-radius:999px;background:rgba(255,255,255,.07)}
.stat i{width:calc(var(--u)*5);height:calc(var(--u)*2.2);margin-right:calc(var(--u)*1.2);border-radius:999px;background:rgba(255,255,255,.2)}
.stat b{width:calc(var(--u)*.9);height:calc(var(--u)*2.6);border-radius:2px;background:var(--neon)}
.stat u{width:calc(var(--u)*.8);height:calc(var(--u)*.8);margin-left:calc(var(--u)*1.2);border-radius:50%;background:rgba(255,255,255,.35)}
.more{position:absolute;right:calc(var(--u)*5);top:calc(var(--u)*4.6);font-size:calc(var(--u)*4);letter-spacing:.12em;line-height:1;color:var(--neon);text-shadow:0 0 8px var(--neon)}
.bl{position:absolute;left:calc(var(--u)*58);right:calc(var(--u)*6);top:calc(var(--u)*12)}
.bh{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(var(--u)*3);opacity:.85}
.bh span:last-child{color:var(--neon);font-weight:600}
.bl b{white-space:nowrap;display:block;margin:calc(var(--u)*.8) 0 calc(var(--u)*.4);font-size:calc(var(--u)*7.6);font-weight:600;letter-spacing:-.02em;line-height:1.05;text-align:right}
.bl em{white-space:nowrap;display:block;text-align:right;font-style:normal;font-size:calc(var(--u)*3.4);opacity:.8}
.cm{position:absolute;left:calc(var(--u)*7);top:46%;transform:translateY(-50%);display:flex;align-items:center;gap:calc(var(--u)*3)}
.ib{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;border-radius:calc(var(--u)*4);border:2px solid currentColor;color:var(--cream);display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease)}
.ib svg{width:62%;height:62%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib text{fill:currentColor;stroke:none}
.t{display:block;font-size:calc(var(--u)*9.8);font-weight:600;letter-spacing:.05em;line-height:1;color:var(--neon);text-shadow:0 0 12px var(--neon)}
.s{display:block;margin-top:calc(var(--u)*1.6);font-size:calc(var(--u)*4);opacity:.8}
.cc.c2::after,.cc.c3::after,.cc.c3::before{display:none}
.cc.c3{border:2px dashed var(--orange);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.4),inset 0 0 26px rgba(217,84,30,.22),0 0 16px rgba(217,84,30,.3);cursor:pointer}
.cc.c3 .ib{color:var(--orange)}
.cc.c3 .t{color:var(--cream);text-shadow:none;font-size:calc(var(--u)*8)}
.cc.c3:hover .ib{background:var(--orange);color:var(--cream);border-color:var(--orange);transform:rotate(90deg)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:999px;background:rgba(17,17,17,.25);transition:width .35s var(--ease),background .35s}
.dots i.on{width:20px;background:var(--orange)}
.dots{margin-bottom:20px}
.card small{font-size:14px;opacity:.7}
.bal{display:flex;align-items:center;gap:12px;margin:6px 0 20px}
.bal strong{font-size:38px;font-weight:600;letter-spacing:-.02em;transition:filter .35s var(--ease)}
.bal.hide strong{filter:blur(12px)}
.eye{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;transition:transform .25s var(--ease)}
.eye:active{transform:scale(.85)}
.eye svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cardfoot{display:flex;justify-content:space-between;font-size:14px;opacity:.8}
#card{border-radius:calc((min(100vw,480px) - 34px)*.092056);aspect-ratio:1.586;width:calc(min(100vw,480px) - 34px);margin-left:calc(50% - min(50vw,240px) + 12px);display:flex;flex-direction:column;justify-content:space-between}
#card .bal{margin:0}
.app .actions,.app .panel{width:calc(min(100vw,480px) - 34px);margin-left:calc(50% - min(50vw,240px) + 12px)}
@media(min-width:560px){#card,.app .actions,.app .panel{width:calc(100% + 2px);margin-left:-6px}#card{border-radius:36.5px}}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.act{text-align:center;line-height:1.25}
.act{padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;position:relative;overflow:hidden;
  transition:transform .3s var(--ease),background .3s}
.act:active{transform:scale(.92)}
.act i{width:38px;height:38px;border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:background .3s,transform .4s var(--ease)}
.act:hover i{background:var(--orange);transform:rotate(-10deg) scale(1.08)}
.act svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ripple{position:absolute;border-radius:50%;background:rgba(217,84,30,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* spending */
.panel{padding:20px;margin-bottom:20px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ph h2{font-size:18px;font-weight:600}
.seg{position:relative;display:flex;background:rgba(17,17,17,.08);border-radius:999px;padding:3px}
.seg button{position:relative;z-index:1;padding:6px 14px;font-size:13px;font-weight:500;border-radius:999px;transition:color .3s}
.seg button[aria-pressed=true]{color:var(--cream)}
.pill{position:absolute;top:3px;bottom:3px;left:3px;background:var(--ink);border-radius:999px;transition:transform .4s var(--ease),width .4s var(--ease)}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;opacity:.9}
.bar b{display:block;width:100%;border-radius:10px;background:var(--ink);transform-origin:50% 100%;transform:scaleY(0);transition:transform .8s var(--ease),background .3s}
.bar.hi b{background:var(--orange)}
.bar:hover b{background:var(--orange)}

/* list */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(17,17,17,.08);transition:transform .3s var(--ease)}
.tx:last-child{border-bottom:0}
.tx:active{transform:translateX(6px)}
.ic{width:42px;height:42px;border-radius:14px;background:rgba(17,17,17,.08);display:grid;place-items:center;font-weight:600}
.tx div{flex:1}
.tx div b{display:block;font-weight:500;font-size:15px}
.tx div span{font-size:13px;opacity:.6}
.amt{font-weight:600}
.amt.in{color:var(--orange)}


/* activity rows, bars as buttons */
.tx{width:100%;text-align:left;font:inherit;cursor:pointer}
.tx div{min-width:0}
.empty{font-size:14px;opacity:.65;padding:6px 0}
.bar{cursor:pointer}
/* sheet */
.scrim,.sheet{visibility:hidden;transition:opacity .35s,transform .5s var(--ease),visibility 0s .5s}
.scrim.on,.sheet.on{visibility:visible;transition-delay:0s}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(17,17,17,.38);opacity:0}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:71;left:50%;bottom:0;width:min(100%,480px);max-height:90%;overflow:auto;transform:translate(-50%,105%);padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:rgba(243,238,227,.86)}
.sheet.on{transform:translate(-50%,0)}
body.lock{overflow:hidden}
.grab{width:40px;height:4px;border-radius:99px;background:rgba(17,17,17,.2);margin:0 auto 10px}
.sheet h2{font-size:20px;font-weight:600;margin:4px 0 14px}
.fld{display:block;margin-bottom:12px}
.fld[hidden]{display:none}
.fld>span{display:block;font-size:13px;opacity:.65;margin-bottom:6px}
.sheet input,.sheet select{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:13px 14px;border-radius:16px;border:1px solid rgba(17,17,17,.14);background:rgba(255,255,255,.65);outline:none;transition:border-color .25s,box-shadow .25s}
.sheet input:focus,.sheet select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(217,84,30,.2)}
.seg2{display:flex;background:rgba(17,17,17,.08);border-radius:999px;padding:3px;margin-bottom:14px}
.seg2 button{flex:1;padding:9px;border-radius:999px;font-weight:500;transition:background .3s,color .3s}
.seg2 button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;padding:14px;border-radius:999px;font-weight:600;transition:transform .2s var(--ease)}
.btns button:active{transform:scale(.96)}
.ghost{background:rgba(17,17,17,.08)}
.go{background:var(--ink);color:var(--cream)}
.del{display:block;width:100%;padding:10px;margin-bottom:6px;font-weight:600;color:#B3360A}
.err{color:#B3360A;font-size:13px;min-height:18px;margin:2px 2px 6px}
.who{margin-bottom:12px}.who b{display:block;font-size:18px;font-weight:600}.who span{font-size:14px;opacity:.65}

.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icons button{aspect-ratio:1;border-radius:14px;background:rgba(17,17,17,.06);display:grid;place-items:center;transition:background .25s,color .25s,transform .2s var(--ease)}
.icons button:active{transform:scale(.92)}
.icons button[aria-checked=true]{background:var(--ink);color:var(--cream)}
.icons svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lnk{font-size:13px;font-weight:600;color:#B3360A;padding:6px 2px}
.det{position:absolute;left:calc(var(--u)*7);right:calc(var(--u)*6);bottom:calc(var(--u)*6);display:flex;justify-content:space-between;gap:calc(var(--u)*2)}
.det div{min-width:0}
.det span{display:block;font-size:calc(var(--u)*2.7);opacity:.65;white-space:nowrap}
.det b{display:block;margin-top:calc(var(--u)*.6);font-size:calc(var(--u)*4.3);font-weight:600;white-space:nowrap}
.trw{display:flex;justify-content:space-between;align-items:center}
.chipc{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ts{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 11px;min-width:0}
.ts span{display:block;font-size:12px;opacity:.65;white-space:nowrap}
.ts b{display:block;margin-top:2px;font-size:15px;font-weight:600;white-space:nowrap}
#card .bal strong{font-size:clamp(28px,9.6vw,38px)}
.tplbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;margin-bottom:14px;border-radius:16px;background:rgba(17,17,17,.06);font-weight:600;transition:background .25s}
.tplbtn:active{background:rgba(17,17,17,.12)}
.tplbtn svg,.tdel svg,.rbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tp{flex:1;min-width:0;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid rgba(17,17,17,.1)}
.tp b{display:block;font-weight:600}.tp span{font-size:13px;opacity:.65}
.tdel{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#B3360A;flex:none}
/* card insights page */
.page{position:fixed;inset:0;z-index:60;overflow:auto;background:radial-gradient(120% 45% at 100% 0%,rgba(217,84,30,.2),transparent 60%),var(--cream);transform:translateX(100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.page.on{transform:none;visibility:visible;transition-delay:0s}
.pg{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.phd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.phd>div{flex:1;min-width:0}.phd h2{font-size:20px;font-weight:600;line-height:1.2}.phd p{font-size:13px;opacity:.65}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.pill2{padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.sum{padding:20px;margin-bottom:16px}
.sumt{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sumt>div{flex:1;min-width:0}
.ib2{width:48px;height:48px;border-radius:15px;background:var(--ink);color:var(--cream);display:grid;place-items:center;flex:none}
.ib2 svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib2 text{fill:currentColor;stroke:none}
.sumt>div>span{display:block;font-size:13px;opacity:.65}.sumt b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em}
.sumt .share{font-size:13px;font-weight:600;color:#B3360A;opacity:1}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div,.hx{background:rgba(17,17,17,.05);border-radius:16px;padding:11px 12px;min-width:0}
.trio span,.hx span{display:block;font-size:12px;opacity:.65}
.trio b,.hx b{display:block;margin-top:3px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hx em{display:block;font-style:normal;font-size:12px;opacity:.6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{margin-bottom:14px}.cat>div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.cat i{display:block;height:6px;border-radius:99px;background:rgba(17,17,17,.08);overflow:hidden}
.cat i b{display:block;height:100%;width:0;border-radius:99px;background:var(--ink);transition:width .8s var(--ease)}
.cat.top i b{background:var(--orange)}
.rg{font-size:13px;opacity:.65}
.page .panel{margin-bottom:16px}

/* performance: flat glass, paused off-screen animation, transform-only motion */
.glass{background:rgba(255,255,255,.55)}
nav.glass{background:rgba(243,238,227,.74);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast.glass{background:rgba(243,238,227,.95)}
.sheet.glass{background:rgba(243,238,227,.995)}
body.busy .blob,body.lock .blob{animation-play-state:paused}
body.lite .blob{animation:none}
body.lite nav.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(243,238,227,.94)}
body.lite .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 8px rgba(17,17,17,.08)}
body.lite .cc.c1,body.lite .cc.c2{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 12px rgba(17,17,17,.25)}
body.lite .neon use{filter:none}
body.lite .neon use:nth-child(1){display:none}
body.lite .neon use:nth-child(2){opacity:.4;stroke-width:10}
body.lite .t{text-shadow:none}
/* 60 cream : 30 ink : 10 orange balance */
.act i{background:var(--orange)}
#card::before{width:320px;height:320px;right:-100px;top:-140px}
body.paged .app,body.paged .bg,body.paged #nav{visibility:hidden}
#loader.done .ring,#loader.done .ring span{animation:none}
body.ready .rise.rd{animation:none;opacity:1;transform:none}
.bar b.up{transform:none}
/* nav */
nav{position:fixed;z-index:10;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(calc(100% - 32px),380px);display:flex;justify-content:space-between;padding:8px;border-radius:999px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;font-weight:500;border-radius:999px;transition:background .35s var(--ease),color .35s,transform .25s var(--ease)}
nav button:active{transform:scale(.9)}
nav button[aria-current=page]{background:var(--ink);color:var(--cream)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* one entrance moment after loader */
.rise{opacity:0;transform:translateY(18px)}
body.ready .rise{animation:rise .8s var(--ease) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}

.toast{position:fixed;z-index:80;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);opacity:0;visibility:hidden;padding:10px 18px;font-size:14px;font-weight:500;transition:transform .5s var(--ease),opacity .3s,visibility .5s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rise{opacity:1;transform:none}
}

/* header actions, hints, neon swatches */
.hr{display:flex;align-items:center;gap:10px}
#themeb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;opacity:.6;margin:-6px 2px 12px}
.neons{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.neons button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(17,17,17,.2);box-shadow:0 0 10px var(--g);transition:transform .2s var(--ease),box-shadow .25s}
.neons button:active{transform:scale(.9)}
.neons button[aria-checked=true]{box-shadow:0 0 0 3px #F3EEE3,0 0 0 5px var(--ink),0 0 12px var(--g)}

.mnav b{font-size:16px;font-weight:600}
.mnav .rbtn[disabled]{opacity:.35;pointer-events:none}
.rlink{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:12px 2px 0;border-top:1px solid rgba(17,17,17,.1);font-weight:600;font-size:14px}
.rlink svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(17,17,17,.08);font-size:14px}
.rrow:last-of-type{border-bottom:0}.rrow span:last-child{opacity:.75;text-align:right}
.cmp{font-size:13px;opacity:.7;margin-top:12px}
.inst{width:100%;padding:14px;border-radius:999px;font-weight:600;margin-bottom:6px}
/* dark theme: ink 60 / cream 30 / orange 10 */
html.dark{color-scheme:dark;--glass:rgba(255,255,255,.06);--glass-edge:rgba(255,255,255,.14)}
html.dark body{background:var(--ink);color:var(--cream)}

/* four quick actions, transfer */
.actions{grid-template-columns:repeat(4,1fr);gap:8px}
.act{font-size:12px;padding:14px 2px 12px;justify-content:flex-start;min-height:96px}
.act i{width:36px;height:36px}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

html.dark .swap{background:rgba(255,255,255,.08)}
html.dark .rlink,html.dark .rrow{border-color:rgba(255,255,255,.1)}
</style>

var deck=$("#deck"),track=$("#track"),cards=[],dots=[];
var GAP=14,step=1,x=0,idx=0,sx=0,sxo=0,moved=0,lx=0,lt=0,v=0,raf=0;
var q=0,dn=-1;function sched(){if(!q)q=requestAnimationFrame(function(){q=0;render()})}
function render(){var pos=-x/step;track.style.transform="translate3d("+x+"px,0,0)";
  cards.forEach(function(c,i){var d=Math.round(Math.min(Math.abs(i-pos),1)*100);if(c._d===d)return;c._d=d;c.style.transform="scale("+(1-d*.0008)+")";c.style.opacity=1-d*.004});
  var n=Math.max(0,Math.min(cards.length-1,Math.round(pos)));if(n!==dn){dn=n;dots.forEach(function(d,i){d.classList.toggle("on",i===n)})}}
function glide(to){cancelAnimationFrame(raf);if(calm){x=to;render();return}
  (function f(){x+=(to-x)*.16;if(Math.abs(to-x)<.4){x=to;render();return}render();raf=requestAnimationFrame(f)})()}
function go(i){idx=Math.max(0,Math.min(cards.length-1,i));glide(-idx*step)}
function measure(){if(!cards.length)return;step=cards[0].offsetWidth+GAP;x=-idx*step;render()}
function move(e){var dx=e.clientX-sx,lo=-(cards.length-1)*step,nx=sxo+dx;moved=Math.max(moved,Math.abs(dx));
  if(nx>0)nx*=.35;else if(nx<lo)nx=lo+(nx-lo)*.35;
  var dt=e.timeStamp-lt;if(dt>0)v=.7*v+.3*((e.clientX-lx)/dt);lx=e.clientX;lt=e.timeStamp;x=nx;sched()}
function up(e){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
  deck.classList.remove("drag");setTimeout(function(){document.body.classList.remove("busy")},600);if(e.timeStamp-lt>80)v=0;
  go(Math.max(idx-1,Math.min(idx+1,Math.round(-x/step-v*180/step))))}
deck.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"&&e.button!==0)return;
  moved=0;sx=lx=e.clientX;sxo=x;lt=e.timeStamp;v=0;cancelAnimationFrame(raf);deck.classList.add("drag");document.body.classList.add("busy");sampleFps("drag",40);
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up)});
deck.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(idx+1);else if(e.key==="ArrowLeft")go(idx-1);
  else if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("cc")&&e.target.tagName!=="BUTTON"){e.preventDefault();e.target.click()}});
